<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--g:#22a447;--lg:#b8e35a;--o:#ff9f2e;--r:#ff6b5e;--y:#ffe14d}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;font-size:14px}
  h1,h2,h3,.round{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif}
  header{padding:16px 16px 0;max-width:1100px;margin:0 auto}
  header h1{margin:0;font-size:22px;font-weight:800}
  header h1 .with{font-weight:500;color:#888;font-size:16px;margin:0 6px}
  header h1 .name{background:linear-gradient(transparent 60%,var(--y) 60%);padding:0 2px}
  header h1 .tag{font-size:11px;background:var(--ink);color:#fff;padding:3px 8px;border-radius:4px;vertical-align:middle;margin-left:8px;font-family:"Noto Sans JP"}
  nav{display:flex;gap:6px;margin-top:14px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
  nav button{border:2px solid var(--ink);border-bottom:0;background:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font:700 13px "M PLUS Rounded 1c";cursor:pointer;margin-bottom:-2px}
  nav button.on{background:var(--ink);color:#fff}
  main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
  .btn{display:inline-block;padding:7px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:700 13px "M PLUS Rounded 1c";cursor:pointer;box-shadow:0 2px 0 var(--ink);color:var(--ink)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.go{background:var(--g);color:#fff}.btn.warn{background:var(--o);color:#fff}.btn.no{background:var(--r);color:#fff}.btn.dark{background:var(--ink);color:#fff}
  .btn.big{padding:11px 18px;font-size:15px}
  .btn[disabled]{opacity:.5;cursor:wait}
  .card{border:2px solid var(--ink);border-radius:10px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .muted{color:var(--sub);font-size:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--ink)}
  .b-pend{background:#fff3cd}.b-ok{background:#eaf7ee}.b-off{background:#eee;color:#888}.b-rej{background:#fde2df}
  input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1.5px solid #c7c7cc;border-radius:6px;background:#fff}
  textarea{width:100%}
  label.f{display:block;font-size:12px;font-weight:700;margin-top:10px}
  label.f input,label.f select{margin-top:4px}
  .req{border-top:1.5px dashed #c7c7cc;margin-top:12px;padding-top:12px}
  .range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
  .range input[type=time]{width:110px}
  .url{width:100%;font-size:12px;margin-top:6px}
  .days{display:flex;gap:4px}
  .days span{width:34px;text-align:center;border:1.5px solid #c7c7cc;border-radius:6px;padding:5px 0;cursor:pointer;user-select:none}
  .days span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .editor{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .editor .form{flex:1 1 280px;min-width:0}
  .editor .gridwrap{flex:3 1 560px;min-width:0}
  .grid{display:grid;gap:2px;user-select:none;touch-action:none}
  .gh{text-align:center;font:700 12px "M PLUS Rounded 1c";padding:4px 0}
  .gh small{display:block;font-size:10px;color:#888;font-weight:500}
  .gt{font-size:10px;color:#999;text-align:right;padding-right:4px;line-height:22px}
  .c{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;white-space:nowrap}
  .c .ev{font-size:9px;font-weight:500;padding:0 2px;overflow:hidden;text-overflow:ellipsis}
  .c.ov::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--ink);border:1px solid #fff}
  .y-◎{background:var(--g);color:#fff}.y-○{background:var(--lg);color:#2c4a05}.y-△{background:var(--o);color:#fff}.y-×{background:var(--r);color:#fff}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .pill{display:inline-flex;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:2px solid var(--ink)}
  .brushes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .brush{padding:6px 10px;border-radius:6px;border:2px solid #c7c7cc;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
  .brush.on{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
  .detail{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;background:#fffdf2}
  .detail .e{padding:6px 0;border-bottom:1px solid var(--line)}
  .detail .e:last-child{border:0}
  .pager{display:flex;gap:8px;align-items:center;margin:6px 0}
  table.rules{border-collapse:collapse;width:100%}
  table.rules td,table.rules th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:10}
  .loading{color:var(--sub);padding:20px 0}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>日程調整<span class="with">with</span><span class="name">下野</span><span class="tag">管理</span></h1>
  <nav id="nav">
    <button data-tab="links" class="on">リンク一覧</button>
    <button data-tab="edit">リンク作成・編集</button>
    <button data-tab="rules">カレンダー設定</button>
  </nav>
</header>
<main>
  <section id="tab-links"><div class="loading">読み込み中…</div></section>
  <section id="tab-edit" class="hidden"></section>
  <section id="tab-rules" class="hidden"></section>
</main>
<div class="toast" id="toast"></div>

<?!= include_('SlotsClient') ?>
<script>
var PARAMS = JSON.parse(<?= params ?>);
var SYMS = ['◎', '○', '△', '×'];
var LABEL = { '◎': '空いています', '○': '空き・前後に予定', '△': '相談可・未定', '×': '不可' };
var WD = ['月', '火', '水', '木', '金', '土', '日'];
var S = null;            // server state
var draft = null;        // link being edited
var grid = null;         // { events, slots }
var brush = 'info';
var page = 0;            // week page in editor

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, ng) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { toast('エラー：' + (e.message || e)); ng(e); })[fn].apply(null, args);
  });
}
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, 3000); }
function minToHHMM(m) { return Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); }
function minToInput(m) { var h = Math.floor(m / 60); return (h < 10 ? '0' : '') + h + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); }
function inputToMin(v) { var p = v.split(':').map(Number); return p[0] * 60 + p[1]; }
function msToMinOfDay(ms) { return Math.round((ms - Slots.jstMidnight(Slots.jstDateString(ms))) / 60000); }
function guestUrl(l) { return S.guestBase + '?l=' + l.id; }
function busy(btn, on) { if (btn) btn.disabled = on; }

function showTab(name) {
  [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  ['links', 'edit', 'rules'].forEach(function (t) { $('tab-' + t).classList.toggle('hidden', t !== name); });
}
$('nav').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab === 'edit' && !draft) newDraft();
  showTab(b.dataset.tab);
  if (b.dataset.tab === 'edit') renderEditor();
  if (b.dataset.tab === 'rules') renderRules();
};

function load() {
  return call('adminGetState').then(function (st) { S = st; renderLinks(); });
}

// ================= リンク一覧 =================
function renderLinks() {
  var h = '<div class="row" style="margin-bottom:14px"><span class="muted">相手ごとのリンクと、届いた申請です。</span><span class="sp"></span>'
    + '<button class="btn dark" data-act="new">＋ 新しいリンク</button></div>';
  if (!S.links.length) h += '<p class="muted">まだリンクがありません。「＋ 新しいリンク」から作成してください。</p>';
  S.links.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (l) {
    var reqs = S.requests.filter(function (r) { return r.linkId === l.id; });
    var pend = 0, ok = 0;
    reqs.forEach(function (r) { r.ranges.forEach(function (x) { if (x.status === 'pending') pend++; if (x.status === 'approved') ok++; }); });
    var badge = !l.active ? '<span class="badge b-off">停止中</span>'
      : pend ? '<span class="badge b-pend">申請 ' + pend + '件 未対応</span>'
      : ok ? '<span class="badge b-ok">確定 ' + ok + '件</span>' : '<span class="badge">申請なし</span>';
    h += '<div class="card" data-link="' + l.id + '"><div class="row"><b class="round" style="font-size:16px">' + esc(l.name) + '</b>' + badge + '<span class="sp"></span>'
      + '<button class="btn" data-act="edit">編集</button>'
      + '<button class="btn" data-act="copy">リンクをコピー</button>'
      + '<button class="btn" data-act="toggle">' + (l.active ? '停止' : '再開') + '</button></div>'
      + '<div class="muted" style="margin-top:4px">' + l.startDate + ' 〜 ' + l.endDate + '　' + minToHHMM(l.dayStart) + '–' + minToHHMM(l.dayEnd)
      + '　' + WD.filter(function (_, i) { return l.weekdays[i] === '1'; }).join('') + '　' + l.slotMinutes + '分単位</div>'
      + '<input class="url" readonly value="' + esc(guestUrl(l)) + '">';
    reqs.forEach(function (r) { h += renderRequest(r); });
    h += '</div>';
  });
  $('tab-links').innerHTML = h;
}

function renderRequest(r) {
  var h = '<div class="req" data-req="' + r.requestId + '"><div class="row"><b>' + esc(r.name) + '</b><span class="muted">' + esc(r.email) + '</span><span class="sp"></span>'
    + '<span class="muted">' + new Date(r.createdAt).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) + '</span></div>';
  if (r.message) h += '<div style="margin:4px 0;white-space:pre-wrap">' + esc(r.message) + '</div>';
  r.ranges.forEach(function (x) {
    var st = x.status === 'pending' ? '' : x.status === 'approved' ? '<span class="badge b-ok">承認済み</span>' : '<span class="badge b-rej">却下</span>';
    h += '<div class="range" data-range="' + x.id + '"><b>' + esc(x.label) + '</b>' + st;
    if (x.status === 'pending') {
      h += '<span class="muted">時刻を調整:</span><input type="time" step="1800" data-k="s" value="' + minToInput(msToMinOfDay(x.start)) + '">–'
        + '<input type="time" step="1800" data-k="e" value="' + minToInput(msToMinOfDay(x.end)) + '">'
        + '<button class="btn go" data-act="approve">承認</button>';
    }
    h += '</div>';
  });
  var anyPending = r.ranges.some(function (x) { return x.status === 'pending'; });
  h += '<div class="row" style="margin-top:6px"><button class="btn warn" data-act="modify">修正を提案</button>'
    + (anyPending ? '<button class="btn no" data-act="reject">却下</button>' : '') + '</div>'
    + '<div class="replybox hidden"></div></div>';
  return h;
}

function openReply(reqEl, type) {
  var box = reqEl.querySelector('.replybox');
  var r = S.requests.filter(function (x) { return x.requestId === reqEl.dataset.req; })[0];
  var tmpl = type === 'reject'
    ? 'せっかくご申請いただいたのですが、この日程は都合がつかなくなりました。申し訳ありません。\n別の日時でもう一度ご申請いただけますと幸いです。'
    : 'ご申請ありがとうございます。\nご希望の日時ですが、〇〇でしたら可能です。いかがでしょうか。';
  box.innerHTML = '<label class="f">' + (type === 'reject' ? '却下の連絡（' : '修正の提案（') + esc(r.email) + ' に送ります）<textarea rows="5">' + esc(tmpl) + '</textarea></label>'
    + '<div class="row" style="margin-top:6px"><button class="btn ' + (type === 'reject' ? 'no' : 'warn') + '" data-act="send-reply" data-type="' + type + '">送信' + (type === 'reject' ? 'して却下' : '') + '</button>'
    + '<button class="btn" data-act="cancel-reply">やめる</button></div>';
  box.classList.remove('hidden');
  box.querySelector('textarea').focus();
}

$('tab-links').onclick = function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act;
  var card = b.closest('[data-link]');
  var link = card && S.links.filter(function (l) { return l.id === card.dataset.link; })[0];
  var reqEl = b.closest('[data-req]');
  if (act === 'new') { newDraft(); showTab('edit'); renderEditor(); }
  if (act === 'edit') { draft = JSON.parse(JSON.stringify(link)); page = 0; showTab('edit'); renderEditor(); }
  if (act === 'copy') copyText(card.querySelector('.url'));
  if (act === 'toggle') { busy(b, true); call('adminSetActive', link.id, !link.active).then(load); }
  if (act === 'approve') {
    var rg = b.closest('[data-range]');
    var r = S.requests.filter(function (x) { return x.requestId === reqEl.dataset.req; })[0];
    var x = r.ranges.filter(function (y) { return y.id === rg.dataset.range; })[0];
    var base = Slots.jstMidnight(Slots.jstDateString(x.start));
    var s = base + inputToMin(rg.querySelector('[data-k=s]').value) * 60000;
    var en = base + inputToMin(rg.querySelector('[data-k=e]').value) * 60000;
    busy(b, true);
    call('adminApprove', x.id, s, en).then(function (res) {
      toast(res.ok ? (res.already ? 'すでに処理済みです' : '承認しました：' + res.label) : res.error);
      return load();
    });
  }
  if (act === 'modify' || act === 'reject') openReply(reqEl, act);
  if (act === 'cancel-reply') reqEl.querySelector('.replybox').classList.add('hidden');
  if (act === 'send-reply') {
    busy(b, true);
    call('adminReply', reqEl.dataset.req, b.dataset.type, reqEl.querySelector('.replybox textarea').value)
      .then(function () { toast('送信しました'); return load(); }, function () { busy(b, false); });
  }
};

function copyText(input) {
  input.select();
  var done = function () { toast('コピーしました'); };
  if (navigator.clipboard) navigator.clipboard.writeText(input.value).then(done, function () { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
}

// ================= リンク作成・編集 =================
function todayStr() { return Slots.jstDateString(Date.now()); }
function addDays(date, n) { return Slots.jstDateString(Slots.jstMidnight(date) + n * 86400000); }

function newDraft() {
  var d = S.defaults;
  draft = { id: '', name: '', startDate: todayStr(), endDate: addDays(todayStr(), 13), dayStart: d.dayStart, dayEnd: d.dayEnd,
    weekdays: d.weekdays, slotMinutes: d.slotMinutes, overrides: {}, active: true };
  grid = null; page = 0;
}

function timeOptions(sel) {
  var h = '';
  for (var m = 0; m <= 1440; m += 30) h += '<option value="' + m + '"' + (m === sel ? ' selected' : '') + '>' + minToHHMM(m) + '</option>';
  return h;
}

function renderEditor() {
  var d = draft;
  var h = '<div class="editor"><div class="form card">'
    + '<h3 style="margin:0 0 4px">1. 誰に送る？</h3>'
    + '<label class="f">相手の名前（相手のページに表示）<input id="f-name" style="width:100%" value="' + esc(d.name) + '" placeholder="山田さん（家庭教師）"></label>'
    + '<h3 style="margin:16px 0 4px">2. 見せる範囲</h3>'
    + '<label class="f">期間<div class="row"><input type="date" id="f-start" value="' + d.startDate + '">〜<input type="date" id="f-end" value="' + d.endDate + '"></div></label>'
    + '<label class="f">時間帯<div class="row"><select id="f-ds">' + timeOptions(d.dayStart) + '</select>〜<select id="f-de">' + timeOptions(d.dayEnd) + '</select></div></label>'
    + '<label class="f">曜日<div class="days" id="f-wd">' + WD.map(function (w, i) { return '<span data-i="' + i + '" class="' + (d.weekdays[i] === '1' ? 'on' : '') + '">' + w + '</span>'; }).join('') + '</div></label>'
    + '<label class="f">枠の長さ<select id="f-slot"><option value="30"' + (d.slotMinutes === 30 ? ' selected' : '') + '>30分</option><option value="60"' + (d.slotMinutes === 60 ? ' selected' : '') + '>1時間</option></select></label>'
    + '<h3 style="margin:16px 0 4px">3. 手で上書き</h3>'
    + '<div class="brushes" id="brushes">'
    + '<button class="brush' + (brush === 'info' ? ' on' : '') + '" data-b="info">🔍 予定を見る</button>'
    + '<button class="brush y-×' + (brush === '×' ? ' on' : '') + '" data-b="×">×でブロック</button>'
    + '<button class="brush y-△' + (brush === '△' ? ' on' : '') + '" data-b="△">△にする</button>'
    + '<button class="brush y-◎' + (brush === '◎' ? ' on' : '') + '" data-b="◎">◎にする</button>'
    + '<button class="brush' + (brush === 'reset' ? ' on' : '') + '" data-b="reset">自動に戻す</button></div>'
    + '<div class="muted">ブラシを選んで枠をドラッグ。●印＝手で変えた枠。</div>'
    + '<div style="margin-top:16px"><button class="btn go big" id="save" style="width:100%">' + (d.id ? '保存する' : 'リンクを発行する') + '</button></div>'
    + (d.id ? '<input class="url" readonly id="f-url" value="' + esc(guestUrl(d)) + '"><div class="row" style="margin-top:6px"><button class="btn" id="copy-url">リンクをコピー</button></div>' : '')
    + '</div><div class="gridwrap"><div class="legend">' + SYMS.map(function (s) { return '<span class="pill y-' + s + '">' + s + ' ' + LABEL[s] + '</span>'; }).join('') + '</div>'
    + '<div class="pager"><button class="btn" id="prev">‹ 前の週</button><span id="range-label" class="round"></span><button class="btn" id="next">次の週 ›</button></div>'
    + '<div id="grid" class="grid"><div class="loading">カレンダーを読み込み中…</div></div><div id="detail"></div></div></div>';
  $('tab-edit').innerHTML = h;
  bindEditor();
  refreshGrid();
}

function readForm() {
  draft.name = $('f-name').value;
  draft.startDate = $('f-start').value;
  draft.endDate = $('f-end').value;
  draft.dayStart = Number($('f-ds').value);
  draft.dayEnd = Number($('f-de').value);
  draft.slotMinutes = Number($('f-slot').value);
}

var refreshTimer = null;
function refreshGrid() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function () {
    $('grid').innerHTML = '<div class="loading">カレンダーを読み込み中…</div>';
    call('adminGetGrid', draft).then(function (g) { grid = g; renderGrid(); }, function () { $('grid').innerHTML = '<div class="loading">読み込めませんでした。期間・時間帯を確認してください。</div>'; });
  }, 300);
}

function dates() {
  var seen = {}, out = [];
  grid.slots.forEach(function (s) { if (!seen[s.d]) { seen[s.d] = 1; out.push(s.d); } });
  return out;
}

function renderGrid() {
  var ds = dates();
  var pages = Math.max(1, Math.ceil(ds.length / 7));
  page = Math.min(page, pages - 1);
  var shown = ds.slice(page * 7, page * 7 + 7);
  $('range-label').textContent = shown.length ? shown[0].slice(5).replace('-', '/') + ' – ' + shown[shown.length - 1].slice(5).replace('-', '/') : '表示する日がありません';
  $('prev').disabled = page === 0; $('next').disabled = page >= pages - 1;
  var step = draft.slotMinutes;
  var rows = []; for (var m = draft.dayStart; m + step <= draft.dayEnd; m += step) rows.push(m);
  var by = {}; grid.slots.forEach(function (s, i) { by[s.s] = i; });
  var g = $('grid');
  g.style.gridTemplateColumns = '40px repeat(' + Math.max(shown.length, 1) + ',minmax(0,1fr))';
  var h = '<div></div>' + shown.map(function (d) {
    var dt = new Date(Slots.jstMidnight(d) + 9 * 3600000); return '<div class="gh">' + dt.getUTCDate() + '<small>' + '日月火水木金土'[dt.getUTCDay()] + '</small></div>';
  }).join('');
  rows.forEach(function (m) {
    h += '<div class="gt">' + (m % 60 === 0 ? minToHHMM(m) : '') + '</div>';
    shown.forEach(function (d) {
      var start = Slots.jstMidnight(d) + m * 60000;
      var i = by[start];
      if (i === undefined) { h += '<div></div>'; return; }
      var s = grid.slots[i];
      var ov = Object.prototype.hasOwnProperty.call(draft.overrides, s.s);
      var y = ov ? draft.overrides[s.s] : s.a;
      var title = !ov && s.ev.length ? grid.events[s.ev[0]].title : '';
      h += '<div class="c y-' + y + (ov ? ' ov' : '') + '" data-s="' + s.s + '">' + (title ? '<span class="ev">' + esc(title) + '</span>' : y) + '</div>';
    });
  });
  g.innerHTML = h;
}

function showDetail(start) {
  var s = grid.slots.filter(function (x) { return String(x.s) === String(start); })[0];
  if (!s) return;
  var range = Slots.formatRange({ start: s.s, end: s.s + draft.slotMinutes * 60000 });
  var h = '<div class="detail"><b>' + esc(range) + '</b>　自動判定 ' + s.a;
  if (!s.ev.length) h += '<div class="muted" style="margin-top:6px">この枠に予定はありません。</div>';
  s.ev.forEach(function (i) {
    var e = grid.events[i];
    h += '<div class="e"><b>' + esc(e.title || '（タイトルなし）') + '</b> <span class="muted">' + esc(e.calendar) + '</span><br>'
      + (e.allDay ? '終日' : esc(Slots.hhmm(e.start) + '–' + Slots.hhmm(e.end)))
      + (e.location ? '　📍' + esc(e.location) : '')
      + (e.description ? '<div style="white-space:pre-wrap;margin-top:4px">' + esc(e.description) + '</div>' : '') + '</div>';
  });
  $('detail').innerHTML = h + '</div>';
}

function bindEditor() {
  ['f-start', 'f-end', 'f-ds', 'f-de', 'f-slot'].forEach(function (id) { $(id).onchange = function () { readForm(); refreshGrid(); }; });
  $('f-name').oninput = readForm;
  $('f-wd').onclick = function (e) {
    var s = e.target.closest('span'); if (!s) return;
    var w = draft.weekdays.split(''); var i = Number(s.dataset.i);
    w[i] = w[i] === '1' ? '0' : '1'; draft.weekdays = w.join('');
    s.classList.toggle('on'); refreshGrid();
  };
  $('brushes').onclick = function (e) {
    var b = e.target.closest('.brush'); if (!b) return;
    brush = b.dataset.b;
    [].forEach.call(document.querySelectorAll('.brush'), function (x) { x.classList.toggle('on', x === b); });
  };
  $('prev').onclick = function () { page--; renderGrid(); };
  $('next').onclick = function () { page++; renderGrid(); };
  $('save').onclick = function () {
    readForm();
    var b = $('save'); busy(b, true);
    call('adminSaveLink', draft).then(function (l) {
      var isNew = !draft.id;
      draft = l; toast(isNew ? 'リンクを発行しました' : '保存しました');
      return load().then(function () { renderEditor(); });
    }, function () { busy(b, false); });
  };
  if ($('copy-url')) $('copy-url').onclick = function () { copyText($('f-url')); };

  var g = $('grid'), drag = null;
  function cellAt(ev) { var el = document.elementFromPoint(ev.clientX, ev.clientY); return el && el.closest ? el.closest('.c') : null; }
  function paint(c) {
    if (!c || !drag) return;
    var col = c.dataset.s && Slots.jstDateString(Number(c.dataset.s));
    if (col !== drag.day) return;
    var a = Math.min(Number(c.dataset.s), drag.from), z = Math.max(Number(c.dataset.s), drag.from);
    var step = draft.slotMinutes * 60000;
    for (var t = a; t <= z; t += step) {
      if (brush === 'reset') delete draft.overrides[t]; else draft.overrides[t] = brush;
    }
    renderGrid();
  }
  g.onpointerdown = function (ev) {
    var c = ev.target.closest('.c'); if (!c) return;
    if (brush === 'info') { showDetail(c.dataset.s); return; }
    drag = { day: Slots.jstDateString(Number(c.dataset.s)), from: Number(c.dataset.s) };
    paint(c); ev.preventDefault();
  };
  g.onpointermove = function (ev) { if (drag) paint(cellAt(ev)); };
  document.onpointerup = function () { drag = null; };
}

// ================= カレンダー設定 =================
function renderRules() {
  var h = '<p class="muted">カレンダーごとに、予定を相手にどう見せるかを決めます。<br>× 外せない＝予定と前後のバッファーが×。△ 相談可＝予定が△、前後のバッファーが○。無視＝空きとして扱う（終日予定も無視）。</p>'
    + '<table class="rules"><tr><th>カレンダー</th><th>扱い</th><th>前後バッファー</th></tr>';
  S.calendars.forEach(function (c) {
    var r = S.rules[c.id] || { kind: 'block', bufferMin: 30 };
    h += '<tr data-id="' + esc(c.id) + '" data-name="' + esc(c.name) + '"><td>' + esc(c.name) + '</td><td><select>'
      + '<option value="block"' + (r.kind === 'block' ? ' selected' : '') + '>× 外せない</option>'
      + '<option value="soft"' + (r.kind === 'soft' ? ' selected' : '') + '>△ 相談可・変更可能</option>'
      + '<option value="ignore"' + (r.kind === 'ignore' ? ' selected' : '') + '>無視</option>'
      + '</select></td><td><input type="number" min="0" max="240" step="5" value="' + r.bufferMin + '" style="width:80px"> 分</td></tr>';
  });
  h += '</table><div style="margin-top:14px"><button class="btn go big" id="save-rules">保存する</button></div>';
  $('tab-rules').innerHTML = h;
  $('save-rules').onclick = function () {
    var rules = {};
    [].forEach.call(document.querySelectorAll('table.rules tr[data-id]'), function (tr) {
      rules[tr.dataset.id] = { name: tr.dataset.name, kind: tr.querySelector('select').value, bufferMin: Number(tr.querySelector('input').value) };
    });
    var b = $('save-rules'); busy(b, true);
    call('adminSaveRules', rules).then(function (r) { S.rules = r; busy(b, false); toast('保存しました'); }, function () { busy(b, false); });
  };
}

// ================= start =================
load().then(function () {
  if (PARAMS.mode === 'reply' && PARAMS.req) {
    var el = document.querySelector('[data-req="' + PARAMS.req + '"]');
    if (el) { el.scrollIntoView(); openReply(el, PARAMS.type === 'reject' ? 'reject' : 'modify'); }
  }
});
</script>
