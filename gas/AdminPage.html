<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--g:#22a447;--lg:#b8e35a;--o:#ff9f2e;--r:#ff6b5e;--y:#ffe14d;--row:18px}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;font-size:14px}
  h1,h2,h3,.round{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif}
  header{padding:16px 16px 0;max-width:1200px;margin:0 auto}
  header h1{margin:0;font-size:22px;font-weight:800}
  header h1 .with{font-weight:500;color:#888;font-size:16px;margin:0 6px}
  header h1 .name{background:linear-gradient(transparent 60%,var(--y) 60%);padding:0 2px}
  header h1 .tag{font-size:11px;background:var(--ink);color:#fff;padding:3px 8px;border-radius:4px;vertical-align:middle;margin-left:8px;font-family:"Noto Sans JP"}
  nav{display:flex;gap:6px;margin-top:14px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
  nav button{border:2px solid var(--ink);border-bottom:0;background:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font:700 13px "M PLUS Rounded 1c";cursor:pointer;margin-bottom:-2px}
  nav button.on{background:var(--ink);color:#fff}
  main{max-width:1200px;margin:0 auto;padding:16px 16px 80px}
  .btn{display:inline-block;padding:7px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:700 13px "M PLUS Rounded 1c";cursor:pointer;box-shadow:0 2px 0 var(--ink);color:var(--ink)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.go{background:var(--g);color:#fff}.btn.warn{background:var(--o);color:#fff}.btn.no{background:var(--r);color:#fff}.btn.dark{background:var(--ink);color:#fff}
  .btn.big{padding:11px 18px;font-size:15px}
  .btn[disabled]{opacity:.5;cursor:default}
  .card{border:2px solid var(--ink);border-radius:10px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .muted{color:var(--sub);font-size:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid var(--ink)}
  .b-pend{background:#fff3cd}.b-ok{background:#eaf7ee}.b-off{background:#eee;color:#888}.b-rej{background:#fde2df}
  input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1.5px solid #c7c7cc;border-radius:6px;background:#fff}
  textarea{width:100%}
  label.f{display:block;font-size:12px;font-weight:700;margin-top:10px}
  label.f input,label.f select{margin-top:4px}
  .req{border-top:1.5px dashed #c7c7cc;margin-top:12px;padding-top:12px}
  .range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
  .range input[type=time]{width:110px}
  .url{width:100%;font-size:12px;margin-top:6px}
  .days{display:flex;gap:4px}
  .days span{width:34px;text-align:center;border:1.5px solid #c7c7cc;border-radius:6px;padding:5px 0;cursor:pointer;user-select:none}
  .days span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .editor{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .editor .form{flex:1 1 280px;min-width:0;max-width:360px}
  .editor .calwrap{flex:3 1 600px;min-width:0}

  /* symbol colors */
  .y-◎{background:var(--g);color:#fff}.y-○{background:var(--lg);color:#2c4a05}.y-△{background:var(--o);color:#fff}.y-×{background:var(--r);color:#fff}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .pill{display:inline-flex;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:2px solid var(--ink)}

  /* brushes: explicit colors so they never fall back to white */
  .brushes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .brushes .brush{padding:7px 11px;border-radius:6px;border:2px solid #c7c7cc;font:700 13px "M PLUS Rounded 1c";cursor:pointer;background:#fff;color:var(--ink)}
  .brushes .brush.b-◎{background:var(--g);color:#fff}
  .brushes .brush.b-○{background:var(--lg);color:#2c4a05}
  .brushes .brush.b-△{background:var(--o);color:#fff}
  .brushes .brush.b-×{background:var(--r);color:#fff}
  .brushes .brush.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

  /* Google Calendar-like week view */
  .pager{display:flex;gap:8px;align-items:center;margin:6px 0}
  .pager .round{flex:1;text-align:center;font-weight:700}
  .cal{border:1.5px solid #d2d2d7;border-radius:8px;overflow:hidden}
  .cal-head{display:grid;border-bottom:1.5px solid #d2d2d7;background:#fafafa}
  .cal-head .dh{text-align:center;padding:6px 2px;font:700 12px "M PLUS Rounded 1c";border-left:1px solid var(--line)}
  .cal-head .dh small{display:block;font-size:10px;color:#888;font-weight:500}
  .cal-head .dh.off{color:#bbb}
  .cal-head .allday{display:block;margin-top:3px;font:500 10px "Noto Sans JP";background:#fde2df;border-radius:3px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal-body{display:grid;max-height:62vh;overflow-y:auto;position:relative;user-select:none;-webkit-user-select:none}
  .gutter div{height:calc(var(--row)*2);font-size:10px;color:#999;text-align:right;padding-right:4px;transform:translateY(-6px)}
  .day{position:relative;border-left:1px solid var(--line);touch-action:none}
  .cell{height:var(--row);border-bottom:1px solid #f0f0f2;display:flex;align-items:center;padding-left:3px;font-size:10px;font-weight:700}
  .cell.hr{border-bottom-color:#d8d8dc}
  .cell.out{background:#fff;color:transparent}
  .cell.paint{cursor:crosshair}
  .cell.y-◎,.cell.y-○,.cell.y-△,.cell.y-×{opacity:.85}
  .cell.ov{box-shadow:inset 3px 0 0 var(--ink)}
  .cell.ov::after{content:"●";font-size:8px;margin-left:2px}
  .day.off .cell{background:repeating-linear-gradient(45deg,#f6f6f6 0 4px,#ececec 4px 8px)!important;color:transparent}
  .ev{position:absolute;left:34%;right:2px;border-radius:4px;background:#fff;border:1px solid #c7c7cc;border-left:4px solid var(--r);padding:1px 4px;font-size:10px;line-height:1.25;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .ev:hover{border-color:var(--ink);z-index:3}
  .ev.soft{border-left-color:var(--o)}
  .ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now{position:absolute;left:0;right:0;height:2px;background:#e8433a;pointer-events:none;z-index:2}

  .pop{position:fixed;z-index:20;width:320px;max-width:calc(100vw - 16px);max-height:60vh;overflow:auto;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;background:#fffdf2;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .pop .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--sub)}
  .resets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .resets .btn{font-size:12px;padding:5px 9px}
  .btn.armed{background:var(--r)!important;color:#fff!important}
  .pop .e{padding:6px 0;border-bottom:1px solid var(--line)}
  .pop .e:last-child{border:0}
  table.rules{border-collapse:collapse;width:100%}
  table.rules td,table.rules th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:10}
  .loading{color:var(--sub);padding:20px 0}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>日程調整<span class="with">with</span><span class="name">下野</span><span class="tag">管理</span></h1>
  <nav id="nav">
    <button data-tab="links" class="on">リンク一覧</button>
    <button data-tab="edit">リンク作成・編集</button>
    <button data-tab="rules">カレンダー設定</button>
    <button data-tab="past">過去の日程調整</button>
  </nav>
</header>
<main>
  <section id="tab-links"><div class="loading">読み込み中…</div></section>
  <section id="tab-edit" class="hidden"></section>
  <section id="tab-rules" class="hidden"></section>
  <section id="tab-past" class="hidden"></section>
</main>
<div class="toast" id="toast"></div>

<?!= include_('SlotsClient') ?>
<script>
var PARAMS = JSON.parse(<?= params ?>);
var SYMS = ['◎', '○', '△', '×'];
var LABEL = { '◎': '空いています', '○': '空き・前後に予定', '△': '相談可・未定', '×': '不可' };
var WD = ['月', '火', '水', '木', '金', '土', '日'];
var ROW_MIN = 30;        // editor row length: 30 min like Google Calendar, 15 min when guests pick 15-min slots
var rowPx = 18;
var S = null;            // server state
var draft = null;        // link being edited
var calData = null;      // cached { from, to, loadedAt, events, pending }
var symbolBy = {};       // auto symbol by slot start (guest-visible slots only)
var weeks = [], page = 0;
var brush = 'info';
var DAY = 86400000;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, ng) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { toast('エラー：' + (e.message || e)); ng(e); })[fn].apply(null, args);
  });
}
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, 3000); }
function minToHHMM(m) { return Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); }
function minToInput(m) { var h = Math.floor(m / 60); return (h < 10 ? '0' : '') + h + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); }
function inputToMin(v) { var p = v.split(':').map(Number); return p[0] * 60 + p[1]; }
function msToMinOfDay(ms) { return Math.round((ms - Slots.jstMidnight(Slots.jstDateString(ms))) / 60000); }
function guestUrl(l) { return S.guestBase + '?l=' + l.id; }
function busy(btn, on) { if (btn) btn.disabled = on; }
function todayStr() { return Slots.jstDateString(Date.now()); }
function addDays(date, n) { return Slots.jstDateString(Slots.jstMidnight(date) + n * DAY); }
function weekdayIndex(date) { return (new Date(Slots.jstMidnight(date) + Slots.JST_OFFSET_MS).getUTCDay() + 6) % 7; } // Mon = 0

function showTab(name) {
  [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  ['links', 'edit', 'rules', 'past'].forEach(function (t) { $('tab-' + t).classList.toggle('hidden', t !== name); });
}
$('nav').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab === 'edit' && !draft) newDraft();
  showTab(b.dataset.tab);
  if (b.dataset.tab === 'edit') renderEditor();
  if (b.dataset.tab === 'rules') renderRules();
  if (b.dataset.tab === 'past') renderPast();
};

function load() {
  return call('adminGetState').then(function (st) { S = st; renderLinks(); });
}

// ================= リンク一覧 =================
// "月〜金 17:00–22:00 / 土日 9:00–22:00": consecutive weekdays with the same range are grouped.
function rangeSummary(l) {
  var groups = [];
  WD.forEach(function (w, i) {
    var r = Slots.rangeForDay(l, i);
    if (!r) return;
    var key = r.start + '-' + r.end, g = groups[groups.length - 1];
    if (g && g.key === key && g.last === i - 1) { g.days.push(w); g.last = i; }
    else groups.push({ key: key, days: [w], last: i, r: r });
  });
  return groups.map(function (g) {
    var days = g.days.length > 2 ? g.days[0] + '〜' + g.days[g.days.length - 1] : g.days.join('');
    return days + ' ' + minToHHMM(g.r.start) + '–' + minToHHMM(g.r.end);
  }).join(' / ');
}

function pendingCount(l) {
  var n = 0;
  S.requests.forEach(function (r) { if (r.linkId === l.id) r.ranges.forEach(function (x) { if (x.status === 'pending') n++; }); });
  return n;
}

// Completed = marked 完了 by hand, or the period is over and nothing is waiting for an answer.
function isPast(l) {
  return !!l.archived || (l.endDate < todayStr() && pendingCount(l) === 0);
}

function renderLinks() {
  var current = S.links.filter(function (l) { return !isPast(l); });
  var pastN = S.links.length - current.length;
  var h = '<div class="row" style="margin-bottom:14px"><span class="muted">進行中の日程調整と、届いた申請です。'
    + (pastN ? '完了したもの（' + pastN + '件）は「過去の日程調整」にあります。' : '') + '</span><span class="sp"></span>'
    + '<button class="btn dark" data-act="new">＋ 新しいリンク</button></div>';
  if (!current.length) h += '<p class="muted">進行中のリンクはありません。「＋ 新しいリンク」から作成してください。</p>';
  current.sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (l) {
    var reqs = S.requests.filter(function (r) { return r.linkId === l.id; });
    var pend = 0, ok = 0;
    reqs.forEach(function (r) { r.ranges.forEach(function (x) { if (x.status === 'pending') pend++; if (x.status === 'approved') ok++; }); });
    var badge = !l.active ? '<span class="badge b-off">停止中</span>'
      : pend ? '<span class="badge b-pend">申請 ' + pend + '件 未対応</span>'
      : ok ? '<span class="badge b-ok">確定 ' + ok + '件</span>' : '<span class="badge">申請なし</span>';
    h += '<div class="card" data-link="' + l.id + '"><div class="row"><b class="round" style="font-size:16px">' + esc(l.name) + '</b>' + badge + '<span class="sp"></span>'
      + '<button class="btn" data-act="edit">編集</button>'
      + '<button class="btn" data-act="copy">リンクをコピー</button>'
      + '<button class="btn" data-act="toggle">' + (l.active ? '停止' : '再開') + '</button>'
      + '<button class="btn dark" data-act="archive">完了にする</button></div>'
      + '<div class="muted" style="margin-top:4px">' + l.startDate + ' 〜 ' + l.endDate + '　' + rangeSummary(l) + '　' + l.slotMinutes + '分単位　追加先：' + esc(l.targetCalendarName || '日程調整') + '</div>'
      + '<input class="url" readonly value="' + esc(guestUrl(l)) + '">';
    reqs.forEach(function (r) { h += renderRequest(r); });
    h += '</div>';
  });
  $('tab-links').innerHTML = h;
}

function renderRequest(r, readonly) {
  var h = '<div class="req" data-req="' + r.requestId + '"><div class="row"><b>' + esc(r.name) + '</b><span class="muted">' + esc(r.email) + '</span><span class="sp"></span>'
    + '<span class="muted">' + new Date(r.createdAt).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) + '</span></div>';
  if (r.message) h += '<div style="margin:4px 0;white-space:pre-wrap"><span class="muted">ご用件：</span>' + esc(r.message) + '</div>';
  if (r.note) h += '<div style="margin:4px 0;white-space:pre-wrap"><span class="muted">備考・コメント：</span>' + esc(r.note) + '</div>';
  r.ranges.forEach(function (x) {
    var st = x.status === 'pending' ? '' : x.status === 'approved' ? '<span class="badge b-ok">承認済み</span>' : '<span class="badge b-rej">却下</span>';
    h += '<div class="range" data-range="' + x.id + '"><b>' + esc(x.label) + '</b>' + st;
    if (readonly && x.status === 'pending') h += '<span class="badge b-pend">未対応</span>';
    if (!readonly && x.status === 'pending') {
      h += '<span class="muted">時刻を調整:</span><input type="time" step="1800" data-k="s" value="' + minToInput(msToMinOfDay(x.start)) + '">–'
        + '<input type="time" step="1800" data-k="e" value="' + minToInput(msToMinOfDay(x.end)) + '">'
        + '<button class="btn go" data-act="approve">承認</button>';
    }
    h += '</div>';
  });
  var anyPending = r.ranges.some(function (x) { return x.status === 'pending'; });
  if (readonly) return h + '</div>';
  var pendingCount = r.ranges.filter(function (x) { return x.status === 'pending'; }).length;
  h += '<div class="row" style="margin-top:6px">' + (pendingCount > 1 ? '<button class="btn go" data-act="approve-all">すべて承認</button>' : '')
    + '<button class="btn warn" data-act="modify">修正を提案</button>'
    + (anyPending ? '<button class="btn no" data-act="reject">却下</button>' : '') + '</div>'
    + '<div class="replybox hidden"></div></div>';
  return h;
}

function openReply(reqEl, type) {
  var box = reqEl.querySelector('.replybox');
  var r = S.requests.filter(function (x) { return x.requestId === reqEl.dataset.req; })[0];
  var tmpl = type === 'reject'
    ? 'せっかくご申請いただいたのですが、この日程は都合がつかなくなりました。申し訳ありません。\n別の日時でもう一度ご申請いただけますと幸いです。'
    : 'ご申請ありがとうございます。\nご希望の日時ですが、〇〇でしたら可能です。いかがでしょうか。';
  box.innerHTML = '<label class="f">' + (type === 'reject' ? '却下の連絡（' : '修正の提案（') + esc(r.email) + ' に送ります）<textarea rows="5">' + esc(tmpl) + '</textarea></label>'
    + '<div class="row" style="margin-top:6px"><button class="btn ' + (type === 'reject' ? 'no' : 'warn') + '" data-act="send-reply" data-type="' + type + '">送信' + (type === 'reject' ? 'して却下' : '') + '</button>'
    + '<button class="btn" data-act="cancel-reply">やめる</button></div>';
  box.classList.remove('hidden');
  box.querySelector('textarea').focus();
}

$('tab-links').onclick = function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act;
  var card = b.closest('[data-link]');
  var link = card && S.links.filter(function (l) { return l.id === card.dataset.link; })[0];
  var reqEl = b.closest('[data-req]');
  if (act === 'new') { newDraft(); showTab('edit'); renderEditor(); }
  if (act === 'edit') { draft = JSON.parse(JSON.stringify(link)); page = -1; showTab('edit'); renderEditor(); }
  if (act === 'copy') copyText(card.querySelector('.url'));
  if (act === 'toggle') { busy(b, true); call('adminSetActive', link.id, !link.active).then(load); }
  if (act === 'archive') {
    armed(b, '完了にする', function () {
      busy(b, true);
      call('adminSetArchived', link.id, true).then(function () { toast('「過去の日程調整」に移しました（リンクは停止）'); return load(); });
    }, 'もう一度押すと完了');
  }
  if (act === 'approve') {
    var rg = b.closest('[data-range]');
    var r = S.requests.filter(function (x) { return x.requestId === reqEl.dataset.req; })[0];
    var x = r.ranges.filter(function (y) { return y.id === rg.dataset.range; })[0];
    var base = Slots.jstMidnight(Slots.jstDateString(x.start));
    var s = base + inputToMin(rg.querySelector('[data-k=s]').value) * 60000;
    var en = base + inputToMin(rg.querySelector('[data-k=e]').value) * 60000;
    busy(b, true);
    call('adminApprove', x.id, s, en).then(function (res) {
      toast(res.ok ? (res.already ? 'すでに処理済みです' : '承認しました：' + res.label) : res.error);
      calData = null; // approvals change the calendar
      return load();
    });
  }
  if (act === 'approve-all') {
    busy(b, true);
    call('adminApproveRequest', reqEl.dataset.req).then(function (res) {
      toast(res.ok ? (res.already ? 'すでに処理済みです' : '承認しました：' + res.label) : res.error);
      calData = null;
      return load();
    });
  }
  if (act === 'modify' || act === 'reject') openReply(reqEl, act);
  if (act === 'cancel-reply') reqEl.querySelector('.replybox').classList.add('hidden');
  if (act === 'send-reply') {
    busy(b, true);
    call('adminReply', reqEl.dataset.req, b.dataset.type, reqEl.querySelector('.replybox textarea').value)
      .then(function () { toast('送信しました'); calData = null; return load(); }, function () { busy(b, false); });
  }
};

function copyText(input) {
  input.select();
  var done = function () { toast('コピーしました'); };
  if (navigator.clipboard) navigator.clipboard.writeText(input.value).then(done, function () { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
}

// ================= 過去の日程調整 =================
function renderPast() {
  var past = S.links.filter(isPast).sort(function (a, b) { return (b.archivedAt || Slots.jstMidnight(b.endDate)) - (a.archivedAt || Slots.jstMidnight(a.endDate)); });
  var h = '<p class="muted">完了した日程調整の記録です（相手のリンクは使えません）。「完了にする」を押したもの、または期間が終わって未対応の申請がないものがここに入ります。</p>';
  if (!past.length) h += '<p class="muted">まだありません。</p>';
  past.forEach(function (l) {
    var reqs = S.requests.filter(function (r) { return r.linkId === l.id; });
    var ok = 0; reqs.forEach(function (r) { r.ranges.forEach(function (x) { if (x.status === 'approved') ok++; }); });
    var why = l.archived ? '完了 ' + new Date(l.archivedAt).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' }) : '期間終了';
    h += '<div class="card" data-link="' + l.id + '" style="border-color:#c7c7cc"><div class="row"><b class="round">' + esc(l.name) + '</b>'
      + '<span class="badge b-off">' + why + '</span><span class="badge b-ok">確定 ' + ok + '件</span><span class="sp"></span>'
      + (l.archived ? '<button class="btn" data-act="restore">一覧に戻す</button>' : '<button class="btn" data-act="edit">期間を延ばす</button>') + '</div>'
      + '<div class="muted" style="margin-top:4px">' + l.startDate + ' 〜 ' + l.endDate + '　' + rangeSummary(l) + '</div>';
    if (!reqs.length) h += '<div class="muted" style="margin-top:8px">申請はありませんでした。</div>';
    reqs.forEach(function (r) { h += renderRequest(r, true); });
    h += '</div>';
  });
  $('tab-past').innerHTML = h;
}

$('tab-past').onclick = function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var card = b.closest('[data-link]');
  var link = S.links.filter(function (l) { return l.id === card.dataset.link; })[0];
  if (b.dataset.act === 'restore') {
    busy(b, true);
    call('adminSetArchived', link.id, false).then(function () { toast('リンク一覧に戻しました（リンクも再開）'); return load().then(renderPast); });
  }
  if (b.dataset.act === 'edit') { draft = JSON.parse(JSON.stringify(link)); page = -1; showTab('edit'); renderEditor(); }
};

// ================= リンク作成・編集 =================
function newDraft() {
  var d = S.defaults;
  draft = { id: '', name: '', startDate: todayStr(), endDate: addDays(todayStr(), 13), dayStart: d.dayStart, dayEnd: d.dayEnd,
    weekdays: d.weekdays, slotMinutes: d.slotMinutes, overrides: {}, active: true };
  page = -1;
}

// Detailed mode rows: one per weekday with on/off and its own range.
function dayRangeRows(d) {
  return '<table class="dr" style="margin-top:6px;border-collapse:collapse">' + WD.map(function (w, i) {
    var r = Slots.rangeForDay(d, i);
    var base = r || { start: d.dayStart, end: d.dayEnd };
    return '<tr data-i="' + i + '"><td style="padding:3px 6px 3px 0"><label style="white-space:nowrap"><input type="checkbox" class="dr-on"' + (r ? ' checked' : '') + '> ' + w + '</label></td>'
      + '<td><select class="dr-s"' + (r ? '' : ' disabled') + '>' + timeOptions(base.start) + '</select>〜<select class="dr-e"' + (r ? '' : ' disabled') + '>' + timeOptions(base.end) + '</select></td></tr>';
  }).join('') + '</table>'
    + '<div class="row" style="margin-top:4px"><button type="button" class="btn" id="dr-copy" style="font-size:12px;padding:4px 8px">月曜の時間を平日にコピー</button></div>';
}

function readDayRanges() {
  return [].map.call(document.querySelectorAll('table.dr tr'), function (tr) {
    if (!tr.querySelector('.dr-on').checked) return null;
    return { start: Number(tr.querySelector('.dr-s').value), end: Number(tr.querySelector('.dr-e').value) };
  });
}

function timeOptions(sel) {
  var h = '';
  for (var m = 0; m <= 1440; m += 30) h += '<option value="' + m + '"' + (m === sel ? ' selected' : '') + '>' + minToHHMM(m) + '</option>';
  return h;
}

function brushButton(key, label, cls) {
  return '<button type="button" class="brush ' + (cls || '') + (brush === key ? ' on' : '') + '" data-b="' + key + '">' + label + '</button>';
}

function renderEditor() {
  var d = draft;
  var h = '<div class="editor"><div class="form card">'
    + '<h3 style="margin:0 0 4px">1. 誰に送る？</h3>'

    + '<label class="f">期間<div class="row"><input type="date" id="f-start" value="' + d.startDate + '">〜<input type="date" id="f-end" value="' + d.endDate + '"></div></label>'
    + '<div id="simple-range"' + (d.dayRanges ? ' class="hidden"' : '') + '>'
    + '<label class="f">相手に見せる時間帯<div class="row"><select id="f-ds">' + timeOptions(d.dayStart) + '</select>〜<select id="f-de">' + timeOptions(d.dayEnd) + '</select></div></label>'
    + '<label class="f">曜日<div class="days" id="f-wd">' + WD.map(function (w, i) { return '<span data-i="' + i + '" class="' + (d.weekdays[i] === '1' ? 'on' : '') + '">' + w + '</span>'; }).join('') + '</div></label></div>'
    + '<label class="f" style="font-weight:500"><input type="checkbox" id="f-detail"' + (d.dayRanges ? ' checked' : '') + '> 曜日ごとに時間帯を設定する（詳細）</label>'

    + '<label class="f">相手が選べる枠の長さ<select id="f-slot"><option value="15"' + (d.slotMinutes === 15 ? ' selected' : '') + '>15分</option><option value="30"' + (d.slotMinutes === 30 ? ' selected' : '') + '>30分</option><option value="60"' + (d.slotMinutes === 60 ? ' selected' : '') + '>1時間</option></select></label>'
    + '<h3 style="margin:16px 0 4px">3. 承認した予定の追加先</h3>'

    + '<h3 style="margin:16px 0 4px">4. 手で上書き</h3>'
    + '<div class="brushes" id="brushes">'
    + brushButton('info', '🔍 予定を見る')
    + brushButton('×', '× ブロック', 'b-×')
    + brushButton('△', '△ 相談可', 'b-△')
    + brushButton('○', '○ 空き(タイト)', 'b-○')
    + brushButton('◎', '◎ 空き', 'b-◎')
    + brushButton('reset', '自動に戻す') + '</div>'
    + '<div class="resets"><button type="button" class="btn" id="reset-week">この週の上書きをリセット</button><button type="button" class="btn" id="reset-all">すべての上書きをリセット</button></div>'
    + '<div class="muted" id="ov-count" style="margin-top:4px"></div>'
    + '<div class="muted">ブラシを選んで、色のついた枠をドラッグ。左に黒い線と●＝手で変えた枠。白い時間帯は相手に見せない時間です。予定のブロックを押すと詳細が出ます。</div>'
    + '<div style="margin-top:16px"><button class="btn go big" id="save" style="width:100%">' + (d.id ? '保存する' : 'リンクを発行する') + '</button></div>'
    + (d.id ? '<input class="url" readonly id="f-url" value="' + esc(guestUrl(d)) + '"><div class="row" style="margin-top:6px"><button class="btn" id="copy-url">リンクをコピー</button></div>' : '')
    + '</div><div class="calwrap"><div class="legend">' + SYMS.map(function (s) { return '<span class="pill y-' + s + '">' + s + ' ' + LABEL[s] + '</span>'; }).join('') + '</div>'
    + '<div class="pager"><button class="btn" id="prev">‹ 前の週</button><span id="range-label" class="round"></span><button class="btn" id="next">次の週 ›</button>'
    + '<button class="btn" id="reload" title="Googleカレンダーから読み直す">↻ 最新にする</button></div>'
    + '<div id="cal" class="cal"><div class="loading" style="padding:20px">カレンダーを読み込み中…</div></div>'
    + '<div class="muted" id="loaded-at" style="margin-top:4px"></div></div></div>';
  $('tab-edit').innerHTML = h;

// Owned calendars (except 「日程調整」, which is the default option) for the approval target.
function fillTargetSelect() {
  if (!S.calendars) { call('adminListCalendars').then(function (c) { S.calendars = c; fillTargetSelect(); }); return; }
  var sel = $('f-target'); if (!sel) return;
  var h = '<option value="">「日程調整」カレンダー（既定）</option>';
  S.calendars.filter(function (c) { return c.owned && !c.booking; }).forEach(function (c) {
    h += '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
  });
  sel.innerHTML = h;
  sel.value = draft.targetCalendarId || '';
  if (sel.value !== (draft.targetCalendarId || '')) sel.value = ''; // chosen calendar no longer exists
}

function readForm() {
  draft.name = $('f-name').value;
  draft.startDate = $('f-start').value;
  draft.endDate = $('f-end').value;
  draft.dayStart = Number($('f-ds').value);
  draft.dayRanges = $('f-detail').checked ? readDayRanges() : null;
  draft.dayEnd = Number($('f-de').value);
  draft.slotMinutes = Number($('f-slot').value);
  var t = $('f-target');
  draft.targetCalendarId = t.value;
  draft.targetCalendarName = t.value ? t.options[t.selectedIndex].text : '';
}

// Calendar data is loaded once for a wide window and reused; symbols are computed here in the browser.
function ensureData(force) {
  var from = draft.startDate < todayStr() ? draft.startDate : todayStr();
  var to = addDays(from, 70) > draft.endDate ? addDays(from, 70) : draft.endDate;
  var fromMs = Slots.jstMidnight(draft.startDate), toMs = Slots.jstMidnight(draft.endDate) + DAY;
  if (!force && calData && calData.from <= fromMs && calData.to >= toMs) return Promise.resolve();
  if ($('cal')) $('cal').innerHTML = '<div class="loading" style="padding:20px">カレンダーを読み込み中…</div>';
  return call('adminGetCalendarData', from, to, !!force).then(function (d) { calData = d; });
}

function recompute() {
  if (!calData || !/^\d{4}-\d{2}-\d{2}$/.test(draft.startDate) || !/^\d{4}-\d{2}-\d{2}$/.test(draft.endDate) || draft.endDate < draft.startDate) {
    $('cal').innerHTML = '<div class="loading" style="padding:20px">期間を確認してください。</div>';
    return;
  }
  ROW_MIN = draft.slotMinutes === 15 ? 15 : 30;
  rowPx = ROW_MIN === 15 ? 12 : 18;
  var slots = Slots.generateSlots(draft);
  var auto = Slots.classify(slots, { events: calData.events, pending: calData.pending, overrides: {} });
  var now = Date.now();
  symbolBy = {};
  slots.forEach(function (s, i) { symbolBy[s.start] = s.start < now ? '×' : auto[i]; });
  // Monday-start weeks covering the period
  weeks = [];
  var first = Slots.jstMidnight(draft.startDate) - weekdayIndex(draft.startDate) * DAY;
  for (var w = first; w <= Slots.jstMidnight(draft.endDate); w += 7 * DAY) weeks.push(Slots.jstDateString(w));
  if (page < 0) { // jump to the week containing today (or the first week)
    var t = Slots.jstMidnight(todayStr());
    page = Math.max(0, weeks.findIndex(function (m) { var a = Slots.jstMidnight(m); return t >= a && t < a + 7 * DAY; }));
  }
  page = Math.min(Math.max(page, 0), weeks.length - 1);
  renderWeek();
  $('loaded-at').textContent = 'Googleカレンダー読み込み：' + new Date(calData.loadedAt).toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' });
}

function symbolFor(start) {
  if (Object.prototype.hasOwnProperty.call(draft.overrides, start)) return { y: draft.overrides[start], ov: true };
  return symbolBy[start] ? { y: symbolBy[start], ov: false } : null;
}

// Guest-visible slot (start of its slot) containing the 30-min editor row at ms, or null.
function slotStartAt(ms) {
  var step = draft.slotMinutes * 60000;
  var date = Slots.jstDateString(ms);
  var r = Slots.rangeForDay(draft, weekdayIndex(date));
  if (!r) return null;
  var base = Slots.jstMidnight(date) + r.start * 60000;
  var s = base + Math.floor((ms - base) / step) * step;
  return symbolBy[s] ? s : null;
}

function renderWeek() {
  var monday = weeks[page];
  var days = []; for (var i = 0; i < 7; i++) days.push(addDays(monday, i));
  $('range-label').textContent = monday.slice(5).replace('-', '/') + ' – ' + days[6].slice(5).replace('-', '/');
  $('prev').disabled = page === 0; $('next').disabled = page >= weeks.length - 1;
  var cols = '44px repeat(7,minmax(0,1fr))';
  var inRange = function (d) { return d >= draft.startDate && d <= draft.endDate && !!Slots.rangeForDay(draft, weekdayIndex(d)); };
  var dayEvents = function (d) {
    var a = Slots.jstMidnight(d), z = a + DAY;
    return calData.events.map(function (e, i) { e.i = i; return e; }).filter(function (e) { return e.start < z && a < e.end; });
  };
  var head = '<div class="cal-head" style="grid-template-columns:' + cols + '"><div></div>' + days.map(function (d) {
    var dt = new Date(Slots.jstMidnight(d) + Slots.JST_OFFSET_MS);
    var allDay = dayEvents(d).filter(function (e) { return e.allDay; });
    return '<div class="dh' + (inRange(d) ? '' : ' off') + '">' + dt.getUTCDate() + '<small>' + '日月火水木金土'[dt.getUTCDay()] + '</small>'
      + allDay.map(function (e) { return '<span class="allday" data-ev="' + e.i + '">終日 ' + esc(e.title || '予定') + '</span>'; }).join('') + '</div>';
  }).join('') + '</div>';
  var body = '<div class="cal-body" id="calbody" style="--row:' + rowPx + 'px;grid-template-columns:' + cols + '"><div class="gutter">';
  for (var hh = 0; hh < 24; hh++) body += '<div style="height:' + (60 / ROW_MIN * rowPx) + 'px">' + (hh ? hh + ':00' : '') + '</div>';
  body += '</div>';
  var now = Date.now();
  days.forEach(function (d) {
    var a = Slots.jstMidnight(d);
    body += '<div class="day' + (inRange(d) ? '' : ' off') + '" data-d="' + d + '">';
    for (var m = 0; m < 1440; m += ROW_MIN) {
      var ms = a + m * 60000;
      var k = cellClass(ms);
      body += '<div class="' + k.cls + ((m + ROW_MIN) % 60 === 0 ? ' hr' : '') + '" data-ms="' + ms + '">' + k.text + '</div>';
    }
    dayEvents(d).filter(function (e) { return !e.allDay; }).forEach(function (e) {
      var s = Math.max(e.start, a), z = Math.min(e.end, a + DAY);
      var top = (s - a) / 60000 / ROW_MIN * rowPx, hgt = Math.max((z - s) / 60000 / ROW_MIN * rowPx - 1, 14);
      body += '<div class="ev' + (e.kind === 'soft' ? ' soft' : '') + '" data-ev="' + e.i + '" style="top:' + top + 'px;height:' + hgt + 'px"><b>' + esc(e.title || '（タイトルなし）') + '</b>'
        + Slots.hhmm(e.start) + '–' + Slots.hhmm(e.end) + '</div>';
    });
    if (now >= a && now < a + DAY) body += '<div class="now" style="top:' + ((now - a) / 60000 / ROW_MIN * rowPx) + 'px"></div>';
    body += '</div>';
  });
  body += '</div>';
  var keepScroll = $('calbody') ? $('calbody').scrollTop : null;
  $('cal').innerHTML = head + body;
  $('calbody').scrollTop = keepScroll !== null ? keepScroll : Math.max(0, (draft.dayStart / ROW_MIN - 2) * rowPx);
  bindCalendar();
}

function showPopover(html, x, y) {
  closePopover();
  var p = document.createElement('div');
  p.className = 'pop';
  p.id = 'pop';
  p.innerHTML = '<button class="x" type="button" aria-label="閉じる">×</button>' + html;
  document.body.appendChild(p);
  var w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(8, Math.min(x + 12, window.innerWidth - w - 8)) + 'px';
  p.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - h - 8)) + 'px';
  p.querySelector('.x').onclick = closePopover;
}
function closePopover() { var p = $('pop'); if (p) p.remove(); }
document.addEventListener('pointerdown', function (ev) {
  if ($('pop') && !ev.target.closest('#pop') && !ev.target.closest('.ev') && !ev.target.closest('.allday')) closePopover();
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closePopover(); });

function showDetailAt(ms, x, y) {
  var z = ms + ROW_MIN * 60000;
  var evs = calData.events.filter(function (e) { return e.start < z && ms < e.end; });
  var slot = slotStartAt(ms);
  var sym = slot !== null ? symbolFor(slot) : null;
  var h = '<b>' + esc(Slots.formatRange({ start: ms, end: z })) + '</b><br><span class="muted">'
    + (sym ? '相手には ' + sym.y + (sym.ov ? '（手で上書き）' : '') + ' と表示' : '相手には表示しない時間') + '</span>';
  if (!evs.length) h += '<div class="muted" style="margin-top:6px">この時間に予定はありません。</div>';
  evs.forEach(function (e) { h += eventDetail(e); });
  showPopover(h, x, y);
}

function eventDetail(e) {
  var kind = e.kind === 'soft' ? '△ 相談可' : '× 外せない';
  return '<div class="e"><b style="font-size:14px">' + esc(e.title || '（タイトルなし）') + '</b><br><span class="muted">' + esc(e.calendar) + '・' + kind + '・前後' + (e.bufferMin || 0) + '分</span><br>'
    + (e.allDay ? Slots.formatRange({ start: e.start, end: e.start }).split(' ')[0] + ' 終日'
      : esc(Slots.formatRange({ start: e.start, end: e.end })))
    + (e.location ? '　📍' + esc(e.location) : '')
    + (e.description ? '<div style="white-space:pre-wrap;margin-top:4px">' + esc(e.description) + '</div>' : '') + '</div>';
}

function bindDayRanges() {
  var box = $('detail-range');
  box.onchange = function (e) {
    var tr = e.target.closest('tr');
    if (tr && e.target.classList.contains('dr-on')) {
      tr.querySelector('.dr-s').disabled = tr.querySelector('.dr-e').disabled = !e.target.checked;
    }
    readForm(); recompute();
  };
  box.onclick = function (e) {
    if (e.target.id !== 'dr-copy') return;
    var rows = box.querySelectorAll('table.dr tr');
    var s = rows[0].querySelector('.dr-s').value, en = rows[0].querySelector('.dr-e').value, on = rows[0].querySelector('.dr-on').checked;
    for (var i = 1; i < 5; i++) {
      rows[i].querySelector('.dr-on').checked = on;
      rows[i].querySelector('.dr-s').value = s; rows[i].querySelector('.dr-e').value = en;
      rows[i].querySelector('.dr-s').disabled = rows[i].querySelector('.dr-e').disabled = !on;
    }
    readForm(); recompute();
  };
}

function bindEditor() {
  ['f-start', 'f-end'].forEach(function (id) { $(id).onchange = function () { readForm(); page = -1; ensureData(false).then(recompute); }; });
  ['f-ds', 'f-de', 'f-slot'].forEach(function (id) { $(id).onchange = function () { readForm(); recompute(); }; });
  $('f-name').oninput = readForm;
  $('f-detail').onchange = function () {
    var on = this.checked;
    readForm();
    if (on) { draft.dayRanges = WD.map(function (_, i) { return Slots.rangeForDay(Object.assign({}, draft, { dayRanges: null }), i); }); $('detail-range').innerHTML = dayRangeRows(draft); bindDayRanges(); }
    $('simple-range').classList.toggle('hidden', on);
    $('detail-range').classList.toggle('hidden', !on);
    readForm(); recompute();
  };
  bindDayRanges();
  $('f-wd').onclick = function (e) {
    var s = e.target.closest('span'); if (!s) return;
    var w = draft.weekdays.split(''); var i = Number(s.dataset.i);
    w[i] = w[i] === '1' ? '0' : '1'; draft.weekdays = w.join('');
    s.classList.toggle('on'); recompute();
  };
  $('brushes').onclick = function (e) {
    var b = e.target.closest('.brush'); if (!b) return;
    brush = b.dataset.b;
    [].forEach.call(document.querySelectorAll('#brushes .brush'), function (x) { x.classList.toggle('on', x === b); });
  };
  $('prev').onclick = function () { page--; renderWeek(); };
  $('next').onclick = function () { page++; renderWeek(); };
  $('reload').onclick = function () { var b = $('reload'); busy(b, true); ensureData(true).then(function () { busy(b, false); recompute(); toast('最新の予定を読み込みました'); }, function () { busy(b, false); }); };
  $('save').onclick = function () {
    readForm();
    var b = $('save'); busy(b, true);
    call('adminSaveLink', draft).then(function (l) {
      var isNew = !draft.id;
      var keepPage = page;
      draft = l; toast(isNew ? 'リンクを発行しました' : '保存しました');
      return load().then(function () { page = keepPage; renderEditor(); });
    }, function () { busy(b, false); });
  };
  if ($('copy-url')) $('copy-url').onclick = function () { copyText($('f-url')); };
  $('reset-week').onclick = function () {
    var b = this;
    armed(b, 'この週の上書きをリセット', function () {
      var a = Slots.jstMidnight(weeks[page]), z = a + 7 * DAY;
      var next = {};
      Object.keys(draft.overrides).forEach(function (k) { if (Number(k) < a || Number(k) >= z) next[k] = draft.overrides[k]; });
      draft.overrides = next; refreshCells(); updateOverrideCount(); toast('この週の上書きをリセットしました（保存で反映）');
    });
  };
  $('reset-all').onclick = function () {
    var b = this;
    armed(b, 'すべての上書きをリセット', function () {
      draft.overrides = {}; refreshCells(); updateOverrideCount(); toast('すべての上書きをリセットしました（保存で反映）');
    });
  };
}

// Drag state lives outside the calendar DOM so it survives updates during a drag.
var calDrag = null;

function cellClass(ms) {
  var slot = slotStartAt(ms);
  var sym = slot !== null ? symbolFor(slot) : null;
  return sym ? { cls: 'cell paint y-' + sym.y + (sym.ov ? ' ov' : ''), text: sym.y } : { cls: 'cell out', text: '' };
}

// Repaint cells in place (no re-render) so dragging stays smooth.
function refreshCells() {
  [].forEach.call(document.querySelectorAll('#calbody .cell'), function (c) {
    var k = cellClass(Number(c.dataset.ms));
    if (c.className !== k.cls) c.className = k.cls;
    if (c.textContent !== k.text) c.textContent = k.text;
  });
}

function paintTo(ms) {
  if (ms === null || !calDrag) return;
  var a = Math.min(ms, calDrag.from), z = Math.max(ms, calDrag.from);
  var next = Object.assign({}, calDrag.base);
  for (var t = a; t <= z; t += ROW_MIN * 60000) {
    var s = slotStartAt(t);
    if (s === null) continue;
    if (brush === 'reset') delete next[s]; else next[s] = brush;
  }
  draft.overrides = next;
  refreshCells();
  updateOverrideCount();
}

// Row under the pointer in the column where the drag started (works over event blocks too).
function rowAtPoint(ev) {
  var r = calDrag.dayEl.getBoundingClientRect();
  var rows = 1440 / ROW_MIN;
  var i = Math.max(0, Math.min(rows - 1, Math.floor((ev.clientY - r.top) / (r.height / rows))));
  return calDrag.dayStart + i * ROW_MIN * 60000;
}

document.addEventListener('pointermove', function (ev) { if (calDrag) paintTo(rowAtPoint(ev)); });
document.addEventListener('pointerup', function () { calDrag = null; });
document.addEventListener('pointercancel', function () { calDrag = null; });

function updateOverrideCount() {
  var n = Object.keys(draft.overrides).length;
  if ($('ov-count')) $('ov-count').textContent = n ? '手で上書きした枠：' + n + '個（保存すると相手のページに反映）' : '手で上書きした枠はありません';
}

// Two-step confirm: first click arms the button, second click within 4s runs.
function armed(btn, label, run, armedText) {
  if (btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.textContent = label; run(); return; }
  btn.classList.add('armed'); btn.textContent = armedText || 'もう一度押すとリセット';
  setTimeout(function () { btn.classList.remove('armed'); btn.textContent = label; }, 4000);
}

function bindCalendar() {
  $('calbody').onpointerdown = function (ev) {
    var evEl = ev.target.closest('.ev');
    if (evEl) { showPopover(eventDetail(calData.events[Number(evEl.dataset.ev)]), ev.clientX, ev.clientY); return; }
    var c = ev.target.closest('.cell'); if (!c) return;
    var ms = Number(c.dataset.ms);
    if (brush === 'info') { showDetailAt(ms, ev.clientX, ev.clientY); return; }
    if (c.classList.contains('out')) { toast('この時間は相手に見せていません（時間帯・曜日・期間を確認）'); return; }
    var dayEl = c.closest('.day');
    calDrag = { dayEl: dayEl, dayStart: Slots.jstMidnight(dayEl.dataset.d), from: ms, base: Object.assign({}, draft.overrides) };
    paintTo(ms);
    ev.preventDefault();
  };
  [].forEach.call(document.querySelectorAll('.allday'), function (el) {
    el.onclick = function (ev) { showPopover(eventDetail(calData.events[Number(el.dataset.ev)]), ev.clientX, ev.clientY); };
  });
  updateOverrideCount();
}

// ================= カレンダー設定 =================
function renderRules() {
  if (!S.calendars) {
    $('tab-rules').innerHTML = '<div class="loading">カレンダー一覧を読み込み中…</div>';
    call('adminListCalendars').then(function (c) { S.calendars = c; renderRules(); });
    return;
  }
  var h = '<p class="muted">カレンダーごとに、予定を相手にどう見せるかを決めます。<br>× 外せない＝予定と前後のバッファーが×。△ 相談可＝予定が△、前後のバッファーが○。無視＝空きとして扱う（終日予定も無視）。</p>'
    + '<table class="rules"><tr><th>カレンダー</th><th>扱い</th><th>前後バッファー</th></tr>';
  S.calendars.forEach(function (c) {
    var r = S.rules[c.id] || { kind: 'block', bufferMin: 30 };
    h += '<tr data-id="' + esc(c.id) + '" data-name="' + esc(c.name) + '"><td>' + esc(c.name) + '</td><td><select>'
      + '<option value="block"' + (r.kind === 'block' ? ' selected' : '') + '>× 外せない</option>'
      + '<option value="soft"' + (r.kind === 'soft' ? ' selected' : '') + '>△ 相談可・変更可能</option>'
      + '<option value="ignore"' + (r.kind === 'ignore' ? ' selected' : '') + '>無視</option>'
      + '</select></td><td><input type="number" min="0" max="240" step="5" value="' + r.bufferMin + '" style="width:80px"> 分</td></tr>';
  });
  h += '</table><div style="margin-top:14px"><button class="btn go big" id="save-rules">保存する</button></div>';
  $('tab-rules').innerHTML = h;
  $('save-rules').onclick = function () {
    var rules = {};
    [].forEach.call(document.querySelectorAll('table.rules tr[data-id]'), function (tr) {
      rules[tr.dataset.id] = { name: tr.dataset.name, kind: tr.querySelector('select').value, bufferMin: Number(tr.querySelector('input').value) };
    });
    var b = $('save-rules'); busy(b, true);
    call('adminSaveRules', rules).then(function (r) { S.rules = r; calData = null; busy(b, false); toast('保存しました'); }, function () { busy(b, false); });
  };
}

// ================= start =================
load().then(function () {
  if (PARAMS.mode === 'reply' && PARAMS.req) {
    var el = document.querySelector('[data-req="' + PARAMS.req + '"]');
    if (el) { el.scrollIntoView(); openReply(el, PARAMS.type === 'reject' ? 'reject' : 'modify'); }
  }
});
</script>
