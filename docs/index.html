<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>日程調整 with 下野</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>日程調整<span class="with">with</span><span class="name" id="owner">下野</span></h1>
  <p class="sub" id="sub">読み込み中…</p>

  <div id="app" class="hidden">
    <div class="legend" id="legend"></div>
    <div class="wrap">
      <div class="gridbox">
        <div class="pager">
          <button class="btn" id="prev" type="button">‹ 前の週</button>
          <span id="week" class="round"></span>
          <button class="btn" id="next" type="button">次の週 ›</button>
        </div>
        <div class="grid" id="grid"></div>
        <p class="hint">色のついた枠を<b>なぞる（ドラッグする）</b>と選べます。何か所でも選べます。選んだ枠をもう一度なぞると取り消せます。</p>
      </div>
      <form class="side" id="form" novalidate>
        <h2>選んだ時間</h2>
        <div id="picked" class="picked"><span class="empty">まだ選ばれていません</span></div>
        <label>お名前<input name="name" required maxlength="50" autocomplete="name"></label>
        <label>メールアドレス<input name="email" type="email" required maxlength="100" autocomplete="email" placeholder="確定のお知らせを送ります"></label>
        <label>ご用件<textarea name="message" rows="3" maxlength="500" placeholder="数学の授業 2時間 など"></textarea></label>
        <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="error" id="error"></p>
        <button class="btn go big" id="submit" type="submit">この時間で申請する</button>
      </form>
    </div>
  </div>

  <div id="done" class="hidden done">
    <h2>申請を送りました</h2>
    <p>下野が確認して、メールでご連絡します。<br>確定すると「【日程確定】」という件名のメールが届きます。</p>
    <div id="done-list" class="picked"></div>
  </div>

  <div id="closed" class="hidden done">
    <h2>このリンクは現在使えません</h2>
    <p>お手数ですが、下野に直接ご連絡ください。</p>
  </div>

  <footer>このページには下野の空き状況だけが表示されています。予定の内容は表示されません。</footer>
</main>
<script src="config.js"></script>
<script src="slots.js"></script>
<script src="app.js"></script>
</body>
</html>
